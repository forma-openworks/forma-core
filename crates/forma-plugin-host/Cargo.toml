[package]
name = "forma-plugin-host"
description = "Платформа Forma: code плагинов — компоненты WebAssembly в песочнице wasmtime, API плагинов версии 1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forma-plugins.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "49.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p2"] }

# Задачи плагинов на Windows — в Job Object (остановка убивает всё дерево процессов); вывод
# старых консольных программ — из кодировки консоли.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
