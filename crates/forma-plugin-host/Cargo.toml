[package]
name = "forma-plugin-host"
description = "Платформа Forma: code плагинов — компоненты WebAssembly в песочнице wasmtime, API плагинов версии 1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forma-plugins.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "49.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p2"] }
