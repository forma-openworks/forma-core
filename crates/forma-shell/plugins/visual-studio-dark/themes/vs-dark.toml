# Visual Studio Dark — по мотивам тёмной темы Visual Studio 2022:
# синяя строка состояния, бирюзовые номера строк, цвета кода как в VS.

[theme]
name = "Visual Studio Dark"
id = "vs-dark"
dark = true
author = "FORMA"

[palette]
vs-blue = "#007acc"
vs-panel = "#2d2d30"
vs-tool = "#252526"
vs-editor = "#1e1e1e"
vs-menu = "#1b1b1c"

[colors]
bg = "$vs-tool"
"bg.panel" = "$vs-panel"
"bg.header" = "$vs-panel"
"bg.deep" = "$vs-panel"
"bg.elevated" = "$vs-menu"
"bg.hover" = "#3e3e40"
border = "#3f3f46"
text = "#f1f1f1"
"text.muted" = "#c8c8c8"
"text.faint" = "#8a8a8a"
heading = "#ffffff"
accent = "$vs-blue"
"accent.soft" = "alpha($accent, 30%)"
"accent.text" = "#ffffff"
selection = "#264f78"
success = "#89d185"
warning = "#ff8c00"
danger = "#f48771"

"menubar.bg" = "$vs-panel"
"menubar.hover" = "#3e3e40"
"statusbar.bg" = "$vs-blue"
"statusbar.text" = "#ffffff"
"statusbar.text.strong" = "#ffffff"
"workspace.tab.active" = "#3e3e40"
"area.header" = "$vs-panel"
"tab.indicator" = "$vs-blue"
"popup.bg" = "$vs-menu"
"popup.border" = "#333337"
"popup.hover" = "#333334"
"modal.bg" = "$vs-tool"
"modal.border" = "#3f3f46"
"control.bg" = "#3f3f46"
"control.border" = "#434346"
"control.hover" = "#3e3e40"
"input.bg" = "#333337"
"input.focus" = "$vs-blue"
"segmented.bg" = "#333337"
"segmented.selected" = "#3f3f46"
"list.selected" = "#094771"
"sidebar.bg" = "$vs-panel"

"editor.bg" = "$vs-editor"
"editor.text" = "#dcdcdc"
"editor.gutter" = "$vs-editor"
"editor.line-number" = "#2b91af"
"editor.line-number.current" = "#d2d2d2"
"editor.cursor" = "#dcdcdc"
"editor.header" = "$vs-tool"
"completion.selected" = "#04395e"
"completion.method" = "#b180d7"
"completion.field" = "#75beff"
"completion.class" = "#ee9d28"
"completion.interface" = "#75beff"
"completion.enum" = "#ee9d28"

[syntax]
comment = "#57a64a"
keyword = "#569cd6"
operator = "#b4b4b4"
string = "#d69d85"
escape = "#ffd68f"
number = "#b5cea8"
function = "#dcdcaa"
type = "#4ec9b0"
parameter = "#9cdcfe"
tag = "#569cd6"
attribute = "#92caf4"
preprocessor = "#9b9b9b"
annotation = "#4ec9b0"
punctuation = "#b4b4b4"
heading = { color = "#569cd6", bold = true }
bold = { color = "#dcdcdc", bold = true }
italic = { color = "#dcdcdc", italic = true }
inserted = "#b5cea8"
deleted = "#f48771"
raw = "#ce9178"

[fonts]
ui = "Segoe UI"
editor = "Cascadia Mono"
console = "Consolas"
